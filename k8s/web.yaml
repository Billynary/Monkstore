apiVersion: apps/v1
kind: Deployment
metadata:
  name: monkstore-web
  namespace: monkstore-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: monkstore-web
  template:
    metadata:
      labels:
        app: monkstore-web
    spec:
      containers:
        - name: web
          image: monkstore-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: monkstore-lab
spec:
  selector:
    app: monkstore-web
  ports:
    - port: 80
      targetPort: 80
