# One-off Job: apply migrations and seed the catalog. Re-runnable (seed is idempotent).
# Run after the database is ready:  kubectl apply -f k8s/migrate-seed-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: monkstore-migrate-seed
  namespace: monkstore-lab
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate-seed
          image: monkstore-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "npx prisma migrate deploy && npm run seed"]
          envFrom:
            - configMapRef:
                name: monkstore-config
            - secretRef:
                name: monkstore-secret
