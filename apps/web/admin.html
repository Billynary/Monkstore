<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Monkey Marketplace</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="vuln-banner">⚠️ This app is intentionally vulnerable. For local testing only.</div>
    <header class="header">
      <nav class="nav">
        <a href="index.html" class="nav__logo"
          ><span class="nav__logo-emoji">🐒</span
          ><span class="nav__logo-text">Monkey Marketplace</span></a
        >
        <ul class="nav__links">
          <li><a href="shop.html" class="nav__link">Shop</a></li>
          <li><a href="login.html" class="nav__link login-link">Login</a></li>
        </ul>
      </nav>
    </header>

    <main class="main">
      <div class="container" style="padding: 2rem 0">
        <h1 style="color: var(--color-text); margin-bottom: 0.5rem">Admin Panel</h1>
        <!-- VULN: page has no frontend auth guard; API only checks X-Admin: true -->
        <p style="color: #f66; font-size: 0.85rem; margin-bottom: 1.5rem">
          No frontend auth guard. The API endpoint only checks for
          <code style="background: var(--color-card); padding: 2px 6px; border-radius: 3px"
            >X-Admin: true</code
          >.
        </p>
        <button id="loadUsers" class="btn btn--primary" style="margin-bottom: 1.5rem">
          Load All Users
        </button>
        <div id="usersTable"></div>
        <hr style="border-color: var(--color-border); margin: 2rem 0" />
        <h2 style="color: var(--color-text); margin-bottom: 1rem">Debug Info</h2>
        <button id="loadDebug" class="btn btn--primary" style="margin-bottom: 1rem">
          Load /api/debug
        </button>
        <pre
          id="debugOutput"
          style="
            background: var(--color-card);
            color: var(--color-text);
            padding: 1rem;
            border-radius: 8px;
            overflow: auto;
            font-size: 0.8rem;
            display: none;
          "
        ></pre>
      </div>
    </main>
    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
